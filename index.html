<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sawan Kids Story Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: ['selector', '[data-theme="dark"]'],
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
              heading: ['Fredoka', 'sans-serif'],
              arabic: ['Amiri', 'serif'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              },
              paper: '#fdfbf7',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg: #f5fbff;
        --card: #ffffff;
        --text: #0f172a;
      }

      [data-theme="dark"] {
        --bg: #0e1624;
        --card: #151f32;
        --text: #e5e7eb;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Nunito', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .card {
        background: var(--card);
        transition: background-color 0.3s ease;
      }

      .font-arabic {
        font-family: 'Amiri', serif;
      }

      /* TOP ACTIONS */
      .top-actions {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 50;
        display: flex;
        gap: 12px;
        align-items: center;
      }

      #themeToggle,
      #langToggle {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--card);
        border: 1px solid rgba(0,0,0,0.1);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        font-size: 1.25rem;
      }

      [data-theme="dark"] #themeToggle,
      [data-theme="dark"] #langToggle {
         background: #1f2937;
         border-color: #374151;
         color: #fff;
      }

      #themeToggle:hover,
      #langToggle:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }

      #langToggle img {
        width: 24px;
        height: 24px;
        object-fit: cover;
        border-radius: 50%;
      }

      /* AGE CARD CUSTOM CSS */
      .age-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 18px;
        padding: 4px; /* prevent shadow crop */
      }

      .age-card {
        position: relative;
        border-radius: 18px;
        padding: 18px 14px;
        text-align: center;
        cursor: pointer;
        color: #fff;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 20px rgba(0,0,0,.12);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 120px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        user-select: none;
      }

      .age-card:hover {
        transform: translateY(-6px) scale(1.04);
        z-index: 10;
        box-shadow: 0 12px 25px rgba(0,0,0,.15);
      }

      .age-card.active {
        outline: 3px solid #fff;
        box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 10px 25px rgba(0,0,0,.2);
        transform: translateY(-4px) scale(1.02);
        z-index: 5;
      }
      
      [data-theme="dark"] .age-card.active {
         outline: 3px solid #1e293b; /* dark theme specific outline */
         box-shadow: 0 0 0 4px rgba(255,255,255,.2), 0 10px 25px rgba(0,0,0,.5);
      }

      .age-range {
        font-size: 26px;
        display: block;
        font-family: 'Fredoka', sans-serif;
        line-height: 1;
        margin-bottom: 4px;
      }

      .age-title {
        font-size: 13px;
        opacity: .95;
        line-height: 1.2;
      }

      .check {
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        background: #fff;
        color: #333; /* Default text color */
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .age-card.active .check {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }

      /* Card Colors - Updated to pastel flats */
      .age-purple { background: #a78bfa; }
      .age-purple .check { color: #a78bfa; }

      .age-yellow { background: #fbbf24; }
      .age-yellow .check { color: #fbbf24; }
      
      .age-blue { background: #38bdf8; }
      .age-blue .check { color: #38bdf8; }

      .age-orange { background: #fb923c; }
      .age-orange .check { color: #fb923c; }

      .age-pink { background: #f472b6; }
      .age-pink .check { color: #f472b6; }

      .age-gold { background: #facc15; }
      .age-gold .check { color: #facc15; }

      .age-lavender { background: #c4b5fd; }
      .age-lavender .check { color: #c4b5fd; }

      /* User Requested Styles */
      /* العنوان الرئيسي للكارت (السن) */
      .age-card h3,
      .age-card .title,
      .age-card .age-title,
      .age-card strong {
        color: #ffffff !important; /* أبيض */
      }

      /* الوصف النصي تحت العنوان */
      .age-card p,
      .age-card .description,
      .age-card small {
        color: #1f2933 !important; /* رمادي غامق قريب للأسود */
        opacity: 1;
      }

      /* VERSION BADGE NEON STYLE */
      .version-badge {
        color: #ff0033;
        font-weight: 800;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 0, 51, 0.12);
        border: 1px solid #ff0033;
        text-shadow:
          0 0 5px #ff0033,
          0 0 10px #ff0033,
          0 0 20px #ff0033;
        box-shadow:
          0 0 10px #ff0033,
          0 0 20px rgba(255, 0, 51, 0.6),
          inset 0 0 10px rgba(255, 0, 51, 0.4);
        animation: neonPulse 1.8s infinite alternate;
        cursor: pointer;
        display: inline-block;
        font-size: 0.85rem;
      }

      @keyframes neonPulse {
        from {
          text-shadow:
            0 0 5px #ff0033,
            0 0 10px #ff0033,
            0 0 20px #ff0033;
          box-shadow:
            0 0 10px #ff0033,
            0 0 20px rgba(255, 0, 51, 0.6);
        }
        to {
          text-shadow:
            0 0 10px #ff3366,
            0 0 20px #ff3366,
            0 0 40px #ff3366;
          box-shadow:
            0 0 20px #ff3366,
            0 0 40px rgba(255, 51, 102, 0.9);
        }
      }

      /* RTL SUPPORT */
      html.rtl {
        direction: rtl;
      }

      html.rtl .top-actions {
        flex-direction: row-reverse;
      }

      html.rtl input,
      html.rtl textarea {
        text-align: right;
      }
    </style>

</html>
